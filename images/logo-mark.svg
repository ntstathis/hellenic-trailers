<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 52" width="120" height="52" role="img" aria-label="Hellenic Trailers">
  <defs>
    <radialGradient id="ht-blue" cx="35%" cy="28%" r="72%">
      <stop offset="0%"   stop-color="#6A6FC4"/>
      <stop offset="28%"  stop-color="#3A3F96"/>
      <stop offset="62%"  stop-color="#2B3079"/>
      <stop offset="90%"  stop-color="#1E1D55"/>
      <stop offset="100%" stop-color="#191748"/>
    </radialGradient>
    <radialGradient id="ht-grey" cx="35%" cy="28%" r="72%">
      <stop offset="0%"   stop-color="#CFCBC8"/>
      <stop offset="30%"  stop-color="#A9A5A3"/>
      <stop offset="62%"  stop-color="#7E7A7A"/>
      <stop offset="88%"  stop-color="#575454"/>
      <stop offset="100%" stop-color="#3E3C3C"/>
    </radialGradient>
    <!-- specular highlight shared by all three spheres -->
    <radialGradient id="ht-gloss" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- The grey sphere sits in FRONT of the two blues, as in the company logo:
       its circle stays whole and the blues disappear behind it. -->
  <circle cx="26" cy="26" r="25" fill="url(#ht-blue)"/>
  <ellipse cx="18" cy="15" rx="12" ry="8" fill="url(#ht-gloss)"/>

  <circle cx="94" cy="26" r="25" fill="url(#ht-blue)"/>
  <ellipse cx="86" cy="15" rx="12" ry="8" fill="url(#ht-gloss)"/>

  <circle cx="60" cy="26" r="25" fill="url(#ht-grey)"/>
  <ellipse cx="52" cy="15" rx="12" ry="8" fill="url(#ht-gloss)"/>
</svg>
